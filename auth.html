<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول · مواعيدي</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-page"><section class="auth-card"><div class="booking-brand">▣ مواعيدي <small>Mawaeedy</small></div><h1 id="authTitle">مرحبًا بعودتك</h1><p id="authSubtitle" class="muted">سجّل الدخول لإدارة مواعيدك</p><button class="google auth-google" id="googleAuth">🇬 المتابعة باستخدام Google</button><div class="auth-divider"><span>أو</span></div><form id="authForm"><div class="field name-field" hidden><label>الاسم</label><input name="name" placeholder="اسمك الكامل"></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required placeholder="••••••••"></div><div class="field reset-field" hidden><label>كلمة المرور الجديدة</label><input name="newPassword" type="password" placeholder="••••••••"></div><button class="primary auth-submit" id="authSubmit">تسجيل الدخول</button></form><button class="auth-link" id="forgot">نسيت كلمة المرور؟</button><p class="auth-switch" id="switchText">ليس لديك حساب؟ <button class="auth-link" id="switchMode">إنشاء حساب</button></p><p class="auth-note">بالاستمرار، أنت توافق على شروط الاستخدام وسياسة الخصوصية.</p></section></main><script src="auth.js"></script></body></html>
